---

- name: Set cron PATH environment variable
  ansible.builtin.cron:
    name: PATH
    env: true
    job: /usr/local/bin:/usr/bin:/bin
    user: "{{ target_user }}"
    state: present
  become: true

- name: Set up cron jobs for {{ target_user }}
  ansible.builtin.cron:
    name: "{{ item.name }}"
    minute: "{{ item.minute }}"
    hour: "{{ item.hour }}"
    job: "{{ item.job }}"
    user: "{{ target_user }}"
    state: present
  loop:
    - name: "Sync dotfiles"
      minute: "0"
      hour: "4"
      job: "/home/{{ target_user }}/scripts/syncdotfiles.sh >> /var/log/{{ target_user }}/syncdotfiles.log 2>&1"
    - name: "Package sync"
      minute: "0"
      hour: "4"
      job: "/home/{{ target_user }}/scripts/packagesync.sh >> /var/log/{{ target_user }}/packagesync.log 2>&1"
  become: true
