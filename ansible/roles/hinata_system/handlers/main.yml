---
- name: Generate locales
  ansible.builtin.command: locale-gen
  changed_when: true

- name: Rebuild initramfs
  ansible.builtin.command: mkinitcpio -P
  changed_when: true

- name: Restart journald
  ansible.builtin.systemd_service:
    name: systemd-journald.service
    state: restarted

- name: Reload systemd
  ansible.builtin.systemd_service:
    daemon_reload: true
