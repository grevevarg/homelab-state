---
- name: Check if 'yay' is installed
  ansible.builtin.command: which yay
  register: yay_check
  ignore_errors: true
  changed_when: false

- name: Check if 'uv' is installed
  ansible.builtin.command: which uv
  register: uv_check
  ignore_errors: true
  changed_when: false

- name: Check if 'flatpak' is installed
  ansible.builtin.command: which flatpak
  register: flatpak_check
  ignore_errors: true
  changed_when: false

- name: Check if omz is installed
  ansible.builtin.command: command -v omz
  register: omzsh_check
  ignore_errors: true
  changed_when: false

- name: Add LizardByte beta repository to pacman.conf
  ansible.builtin.blockinfile:
    path: /etc/pacman.conf
    block: |
      [lizardbyte-beta]
      SigLevel = Optional
      Server = https://github.com/LizardByte/pacman-repo/releases/download/beta
    marker: "# {mark} LizardByte Beta Repository"
  become: true
  when:
    - inventory_hostname in ['hinata', 'maika']

- name: Read and parse package lists
  block:
    - name: Slurp all package files
      ansible.builtin.slurp:
        src: "{{ packages_clone_path }}/{{ inventory_hostname }}/{{ item }}"
      loop: "{{ package_list_files[inventory_hostname] }}"
      register: slurped_files

    - name: Convert slurped content to package lists
      ansible.builtin.set_fact:
        package_data: "{{ package_data | default({}) | combine({item.item | splitext | first: item.content | parse_package_list}) }}"
      loop: "{{ slurped_files.results }}"

    - name: Set individual package lists
      ansible.builtin.set_fact:
        pacman_packages: "{{ package_data.get('paclist', []) }}"
        aur_packages: "{{ package_data.get('aurlist', []) }}"
        apt_packages: "{{ package_data.get('aptlist', []) }}"
        apk_packages: "{{ package_data.get('apklist', []) }}"
        flatpak_packages: "{{ package_data.get('flatpaklist', []) }}"
        uv_packages: "{{ package_data.get('uvlist', []) }}"




- name: Install pacman packages
  community.general.pacman:
    name: "{{ pacman_packages }}"
    state: present
  when:
    - inventory_hostname in ['hinata', 'maika']
    - pacman_packages | length > 0

- name: Install AUR packages
  ansible.builtin.command: "yay -S --noconfirm --needed {{ item }}"
  loop: "{{ aur_packages }}"
  when:
    - inventory_hostname in ['hinata', 'maika']
    - aur_packages | length > 0
    - yay_check.rc == 0
  become: true
  become_user: "{{ target_user }}"


- name: Install apt packages
  ansible.builtin.apt:
    name: "{{ apt_packages }}"
    state: present
    update_cache: true
  when:
    - inventory_hostname in ['macrossnas']
    - apt_packages | length > 0


- name: Install apk packages
  ansible.builtin.apk:
    name: "{{ apk_packages }}"
    state: present
  when:
    - inventory_hostname in ['mafuyu']
    - apk_packages | length > 0


- name: Install flatpak packages
  ansible.builtin.command: "flatpak install flathub -y {{ item }}"
  loop: "{{ flatpak_packages }}"
  when:
    - flatpak_check.rc == 0
    - flatpak_packages | length > 0


- name: Install uv tools
  ansible.builtin.command: "uv tool install {{ item }}"
  loop: "{{ uv_packages }}"
  when:
    - uv_check.rc == 0
    - uv_packages | length > 0

