---

- name: Create temp dotfiles dir
  ansible.builtin.file:
    path: "{{ dotfiles_clone_path }}"
    state: directory
    mode: '0777'

- name: Create temp packages dir
  ansible.builtin.file:
    path: "{{ packages_clone_path }}"
    state: directory
    mode: '0777'

- name: Clone packages repository
  ansible.builtin.git:
    repo: https://github.com/natsukashiixo/packages
    dest: "{{ packages_clone_path }}"
    version: main
    update: true

- name: Clone dotfiles repository
  ansible.builtin.git:
    repo: https://github.com/natsukashiixo/dotfiles_pub
    dest: "{{ dotfiles_clone_path }}"
    version: main
    update: true
