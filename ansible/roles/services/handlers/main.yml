# services/handlers/main.yml
---
- name: reload systemd
  ansible.builtin.systemd_service:
    daemon_reload: true

- name: enable and start antimicrox-hyprdaemon
  ansible.builtin.systemd_service:
    name: antimicrox-hyprdaemon.service
    state: started
    enabled: true
    scope: user
  become: true
  become_user: "{{ target_user }}"

- name: restart gpu-power-limit
  ansible.builtin.systemd_service:
    name: gpu-power-limit.service
    state: restarted
  become: true
